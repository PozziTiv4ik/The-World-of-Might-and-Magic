name: Atlas Native Editor

on:
  push:
    paths: ['tools/Atlas/**', '12_Карты/**', '.github/workflows/atlas.yml']
  pull_request:
    paths: ['tools/Atlas/**', '12_Карты/**', '.github/workflows/atlas.yml']
  workflow_dispatch:

jobs:
  native:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and native regressions
        shell: pwsh
        run: ./tools/Atlas/build.ps1 -Test
      - name: Replay editor scenarios without desktop automation
        shell: pwsh
        run: ./tools/Atlas/test-editor.ps1
      - name: Replay raster and campaign editing in long Windows paths
        shell: pwsh
        run: ./tools/Atlas/test-editor.ps1 -LongPaths -Scenario ./tools/Atlas/tests/scenarios/04-raster-cancellation.json,./tools/Atlas/tests/scenarios/10-campaign-copy.json
      - name: Upload editor replay reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node.js 24
        with:
          name: atlas-editor-reports
          path: .wmma/atlas-editor-tests/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Validate campaign and complete history
        shell: pwsh
        run: |
          & ./tools/Atlas/bin/Atlas.Cli.exe validate ./12_Карты/Карта_мира_Объекты --project . --history
          if ($LASTEXITCODE -ne 0) { throw 'Atlas history validation failed' }
      - name: Verify portable package
        shell: pwsh
        run: ./tools/Atlas/package.ps1
