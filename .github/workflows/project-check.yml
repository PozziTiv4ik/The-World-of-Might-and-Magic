name: Project Check

# Проверка содержимого проекта: пуш в main и pull request. Изменения только в исходниках, ресурсах
# и сборках редактора Regnum её не запускают. Сценарные наборы инструментов — в tools-check.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'tools/Regnum/src/**'
      - 'tools/Regnum/assets/**'
      - 'tools/Regnum/bin/linux-*/**'
      - 'tools/Regnum/bin/macos-*/**'
      - 'tools/Regnum/*.sh'
      - 'tools/Regnum/Regnum.command'
  pull_request:
    paths-ignore:
      - 'tools/Regnum/src/**'
      - 'tools/Regnum/assets/**'
      - 'tools/Regnum/bin/linux-*/**'
      - 'tools/Regnum/bin/macos-*/**'
      - 'tools/Regnum/*.sh'
      - 'tools/Regnum/Regnum.command'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-check:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24

      - name: Check project
        shell: pwsh
        run: .\tools\Проверить_проект.ps1
