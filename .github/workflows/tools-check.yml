name: Tools Check

# Сценарные наборы инструментов на копиях проекта (около 6 минут): только при изменении скриптов,
# шаблонов, схем реестров или hooks; в остальное время — вручную (Run workflow).
on:
  push:
    branches: [main]
    paths:
      - 'tools/*.ps1'
      - 'tools/lib/**'
      - 'tools/migrations/**'
      - '09_Шаблоны/**'
      - '09_Реестры/Схемы/**'
      - '.githooks/**'
      - '.github/workflows/tools-check.yml'
  pull_request:
    paths:
      - 'tools/*.ps1'
      - 'tools/lib/**'
      - 'tools/migrations/**'
      - '09_Шаблоны/**'
      - '09_Реестры/Схемы/**'
      - '.githooks/**'
      - '.github/workflows/tools-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools-check:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24

      - name: Check tools
        shell: pwsh
        run: .\tools\Проверить_инструменты.ps1

      - name: Check context and turn recovery
        shell: pwsh
        run: .\tools\Проверить_систему_v2.ps1

      - name: Check bounded connections and chronology
        shell: pwsh
        run: .\tools\Проверить_связи.ps1

      - name: Check intake integrity and Windows regressions
        shell: pwsh
        run: .\tools\Проверить_аудит.ps1
